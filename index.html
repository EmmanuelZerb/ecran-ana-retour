<!doctype html>
<!--
  Page de retour Spotify → écran « en écoute ».
  Spotify y renvoie le téléphone avec ?code=…&state=<adresse IP de l'écran> ;
  la page le renvoie aussitôt vers http://<IP>/retour, où l'écran termine la liaison.
  Publiée telle quelle sur GitHub Pages (https://emmanuelzerb.github.io/ecran-ana-retour/).
  Seules les adresses de réseau local sont acceptées comme destination.
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Écran Ana</title>
<style>
  :root { --fond: #14110f; --texte: #f3ebdd; --gris: #9f968a; --vert: #9cc26b; --bord: #3a342f; }
  body { margin: 0; background: var(--fond); color: var(--texte); font: 16px/1.5 -apple-system, system-ui, sans-serif; }
  main { max-width: 420px; margin: 0 auto; padding: 32px 20px; }
  h1 { font-size: 22px; margin: 0 0 12px; }
  p { color: #cfc6b8; }
  .ok { color: var(--vert); }
  textarea { width: 100%; box-sizing: border-box; min-height: 110px; border-radius: 12px; border: 1px solid var(--bord);
             background: #1d1916; color: var(--texte); padding: 12px; font-size: 13px; }
  button { display: block; width: 100%; padding: 14px; margin-top: 10px; border: 0; border-radius: 999px;
           background: var(--texte); color: var(--fond); font-weight: 700; font-size: 16px; }
  [hidden] { display: none; }
</style>
</head>
<body>
<main>
  <h1 id="titre">Retour vers l'écran…</h1>
  <p id="texte">Un instant.</p>
  <div id="secours" hidden>
    <textarea id="adresse" readonly></textarea>
    <button id="copier" type="button">Copier l'adresse</button>
  </div>
</main>
<script>
  // Adresses IPv4 privées (partage de connexion iPhone : 172.20.10.x)
  const PRIVEE = /^(10(\.\d{1,3}){3}|192\.168(\.\d{1,3}){2}|172\.(1[6-9]|2\d|3[01])(\.\d{1,3}){2})$/;

  // Adresse de l'écran à ouvrir, ou null si la demande n'est pas exploitable
  function cible(recherche) {
    const q = new URLSearchParams(recherche);
    const ip = q.get("state") || "";
    if (!PRIVEE.test(ip)) return null;
    const p = new URLSearchParams();
    if (q.get("error")) p.set("error", q.get("error"));
    else if (q.get("code")) p.set("code", q.get("code"));
    else return null;
    return "http://" + ip + "/retour?" + p.toString();
  }

  function secours(titre, texte) {
    document.getElementById("titre").textContent = titre;
    document.getElementById("texte").textContent = texte;
    document.getElementById("adresse").value = location.href;
    document.getElementById("secours").hidden = false;
  }

  document.getElementById("copier").addEventListener("click", async () => {
    const champ = document.getElementById("adresse");
    try { await navigator.clipboard.writeText(champ.value); }
    catch { champ.select(); document.execCommand("copy"); }
    document.getElementById("copier").textContent = "Copié ✓";
  });

  const url = cible(location.search);
  if (url) {
    location.replace(url);
    // Toujours là après 5 s : l'écran n'a pas répondu (téléphone sur un autre réseau ?)
    setTimeout(() => secours("L'écran ne répond pas",
      "Vérifie que ce téléphone est connecté au partage de connexion de l'écran, puis recharge cette page. " +
      "Sinon, copie cette adresse et colle-la sur la page de l'écran (« Ça ne revient pas tout seul ? »)."), 5000);
  } else if (new URLSearchParams(location.search).has("code")) {
    secours("Retour automatique impossible",
      "Copie cette adresse et colle-la sur la page de l'écran (« Ça ne revient pas tout seul ? »).");
  } else {
    document.getElementById("titre").textContent = "Écran Ana";
    document.getElementById("texte").textContent =
      "Cette page sert uniquement au retour de Spotify vers l'écran. Rien à faire ici.";
  }
</script>
</body>
</html>
